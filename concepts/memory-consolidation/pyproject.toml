[project]
name = "memory-consolidation"
version = "0.1.0"
description = "Offline hierarchical memory consolidation against the strongest simple alternatives"
requires-python = ">=3.12"
dependencies = ["demos-common", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
demos-common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memcon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
