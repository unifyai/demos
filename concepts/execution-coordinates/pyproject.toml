[project]
name = "execution-coordinates"
version = "0.1.0"
description = "One execution tool whose calls choose what survives, which session they join and where they run, tested against fresh, shared and per-task interpreters"
requires-python = ">=3.12"
dependencies = ["demos-common", "pandas>=2.2", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
demos-common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/execution_coordinates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
