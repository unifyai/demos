[project]
name = "demonstration-by-reference"
version = "0.1.0"
description = "A demonstration as an ordinary request whose frames travel by reference, against inlining, sampling, captioning and a dedicated pipeline"
requires-python = ">=3.12"
dependencies = ["demos-common", "pillow>=11", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
demos-common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demoref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
