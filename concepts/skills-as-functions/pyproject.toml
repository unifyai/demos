[project]
name = "skills-as-functions"
version = "0.1.0"
description = "Does a library of callable, tested functions beat notes, retrieval and long context over a long stream of related tasks?"
requires-python = ">=3.12"
dependencies = ["demos-common"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
demos-common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
