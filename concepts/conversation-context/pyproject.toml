[project]
name = "conversation-context"
version = "0.1.0"
description = "Delegated work that carries the caller's conversation, read-only, nested one layer per handover"
requires-python = ">=3.12"
dependencies = ["demos-common"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
demos-common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conversation_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
