[project]
name = "fast-slow-voice"
version = "0.1.0"
description = "A spoken agent split between a fast model that talks and a slow model that thinks (two designs of the split), against a single fast model, a single slow model and a fast model with everything in its context"
requires-python = ">=3.12"
dependencies = ["demos-common"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
demos-common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_slow_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
