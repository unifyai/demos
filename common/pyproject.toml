[project]
name = "demos-common"
version = "0.1.0"
description = "Shared model client, cost ledger and statistics for the unify demos"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demos_common"]
